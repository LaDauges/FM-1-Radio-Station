<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F4F2">
<title>FM-1 Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* DA « Index » : deux thèmes, jour (blanc, encre, accent bleu) et signal (fond orange plein, encre noire) */
  :root, [data-theme="day"] {
    --bg: #F4F4F2; --ink: #0E0E10; --dim: #55565B; --track: #D9D9D6; --accent: #1F4BFF; --on-accent: #FFFFFF;
    --prim-bg: #0E0E10; --prim-fg: #F4F4F2; --bad-bg: #C8361A; --bad-fg: #FFFFFF; --soft: rgba(14, 14, 16, .05);
  }
  [data-theme="signal"] {
    --bg: #FF5A1F; --ink: #0E0E10; --dim: #0E0E10; --track: rgba(14, 14, 16, .2); --accent: #0E0E10; --on-accent: #FF5A1F;
    --prim-bg: #0E0E10; --prim-fg: #FF5A1F; --bad-bg: #0E0E10; --bad-fg: #FF5A1F; --soft: rgba(14, 14, 16, .08);
  }
  :root { --sans: "Inter Tight", "Arial Narrow", Arial, sans-serif; --mono: "DM Mono", ui-monospace, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--mono); transition: background-color .25s, color .25s; }
  main { max-width: 1280px; margin: 0 auto; padding: 28px clamp(16px, 4vw, 48px) 48px; display: flex; flex-direction: column; gap: 16px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .4; }
  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--ink); }
  .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .dim { color: var(--dim); }
  .big { font-family: var(--sans); font-weight: 900; line-height: .82; letter-spacing: -.055em; text-transform: uppercase; margin: 0; }
  .hidden { display: none !important; }

  /* en-tête */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; font-size: 13px; letter-spacing: .06em; border-bottom: 1.5px solid var(--ink); padding-bottom: 12px; }
  .hl, .hr { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; }
  .brand { font-weight: 500; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
  .pill i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; }
  .pill.on { color: var(--accent); } .pill.on i { background: currentColor; }
  .pill.wait i { background: currentColor; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .badge { border: 1.5px solid var(--ink); padding: 5px 10px; font-size: 12px; font-weight: 500; }
  .langs { display: flex; gap: 2px; }
  .langs button { border: 0; background: transparent; min-width: 36px; min-height: 30px; font-size: 12px; }
  .langs button.on { background: var(--ink); color: var(--bg); }
  .langs button:disabled { opacity: .5; }
  .themebtn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: -8px 0; border: 1.5px solid var(--ink); border-radius: 50%; background: transparent; }

  /* titres */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: end; }
  .hero .side { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; min-width: 0; }
  #titleBox { min-width: 0; overflow: hidden; }
  #title { font-size: 196px; white-space: nowrap; }
  #title .old { color: transparent; -webkit-text-stroke: 2px var(--ink); }
  #title .arrow { padding: 0 .08em; letter-spacing: 0; }
  #title .new { color: var(--accent); }
  #seed { font-family: var(--sans); font-weight: 800; font-size: 44px; letter-spacing: -.03em; line-height: 1; }
  #meta { font-size: 13px; }
  #status { font-size: 13px; font-weight: 500; color: var(--accent); min-height: 1.4em; }
  #plugTitle { font-size: clamp(56px, 11vw, 150px); }

  /* bandeau tu joues */
  .banner { background: var(--ink); color: var(--bg); padding: 14px 16px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .banner b { font-family: var(--sans); font-weight: 900; font-size: 28px; line-height: .9; letter-spacing: -.03em; text-transform: uppercase; }
  .banner .gauge { flex: 1; min-width: 120px; height: 4px; background: rgba(127, 127, 127, .4); } .banner .gauge i { display: block; height: 4px; background: var(--bg); }

  /* arc */
  .arc svg { width: 100%; height: 96px; display: block; }
  #arcAll { fill: var(--track); } #arcDone { fill: var(--accent); } #arcHead { stroke: var(--ink); }
  .phases { display: flex; font-size: 11px; letter-spacing: .1em; margin-top: 6px; text-transform: uppercase; color: var(--dim); }
  .phases span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-right: 6px; }
  .phases span.cur { color: var(--ink); font-weight: 500; }

  /* l'index des styles */
  .idxhead { display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; border-top: 1.5px solid var(--ink); padding-top: 12px; }
  .idxhead .hint { font-size: 11px; letter-spacing: .04em; color: var(--dim); }
  .idx { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 16px; }
  .fam { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .fam > span { font-size: 10px; letter-spacing: .12em; color: var(--dim); padding-bottom: 6px; text-transform: uppercase; }
  .fam button { font: 800 15px/1.1 var(--sans); letter-spacing: -.01em; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 5px 6px; margin-left: -6px; min-height: 30px; border: 1.5px solid transparent; background: transparent; }
  .fam button:hover { background: var(--soft); }
  .fam button.on { background: var(--accent); color: var(--on-accent); }
  .fam button.q { border-color: var(--accent); color: var(--accent); }

  /* boutons */
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn-prim { font-family: var(--sans); font-weight: 900; font-size: 22px; letter-spacing: -.02em; text-transform: uppercase; background: var(--prim-bg); color: var(--prim-fg); border: 0; padding: 10px 18px; min-height: 48px; }
  .btn-prim.huge { font-size: clamp(24px, 4vw, 40px); padding: 12px 22px; min-height: 60px; }
  .btn { background: transparent; border: 1.5px solid var(--ink); padding: 10px 14px; min-height: 48px; font-size: 14px; }
  .btn.on { background: var(--ink); color: var(--bg); }

  /* branchement */
  .plug { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; }
  .check { display: grid; grid-template-columns: 28px 1fr auto; gap: 14px; align-items: center; padding: 11px 12px; margin: 0 -12px; border-bottom: 1.5px solid var(--ink); }
  .check .s { display: flex; align-items: center; gap: 6px; font-size: 13px; text-align: right; }
  .check.bad { background: var(--bad-bg); color: var(--bad-fg); border-bottom-color: transparent; font-weight: 500; }
  .check.wait { color: var(--dim); }
  .guide { border: 1.5px solid var(--ink); padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .guide h2 { margin: 0; font-size: 40px; }
  .guide ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .guide li { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .guide li .n { width: 30px; height: 30px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .guide li .k { border: 1.5px solid var(--ink); padding: 5px 10px; font-weight: 500; white-space: nowrap; }
  .guide .note { background: var(--ink); color: var(--bg); padding: 10px 12px; font-size: 13px; }
  .listen { display: flex; align-items: center; gap: 10px; }
  .listen i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); }
  .listen.ok i { background: var(--ink); }

  /* colonnes du bas */
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; border-top: 1.5px solid var(--ink); padding-top: 14px; }
  .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .lanes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .lane { position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 8px 10px; min-height: 40px;
    border: 1.5px solid var(--ink); font-size: 12px; color: var(--dim); }
  .lane b { font-weight: 500; color: var(--ink); position: relative; }
  .lane span { position: relative; white-space: nowrap; }
  .lane i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); opacity: .25; transition: width .3s; }
  .lane.on { background: var(--ink); color: var(--bg); } .lane.on b { color: var(--bg); }
  .lane.write { border-color: var(--accent); color: var(--accent); } .lane.write b { color: var(--accent); }
  [data-theme="signal"] .lane.write i { opacity: .3; }
  .sched div, .favs li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
  .sched .played { color: var(--dim); } .sched .now { font-weight: 500; } .sched .next { color: var(--accent); font-weight: 500; }
  .favs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .favs li { align-items: center; flex-wrap: wrap; }
  .favs li span { flex: 1; min-width: 140px; }
  .favs button { background: transparent; border: 0; text-decoration: underline; padding: 6px 4px; font-size: 12px; min-height: 32px; }

  /* bas de page */
  details { border-top: 1.5px solid var(--ink); padding-top: 10px; }
  summary { cursor: pointer; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .settings { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 12px 0 4px; font-size: 13px; align-items: center; }
  .settings select { font: inherit; color: inherit; background: transparent; border: 1.5px solid var(--ink); padding: 6px 8px; }
  .settings select option { color: #0E0E10; background: #FFFFFF; }
  input[type=range], input[type=checkbox] { accent-color: var(--ink); }
  #log { font-size: 12px; white-space: pre-wrap; max-height: 260px; overflow: auto; margin-top: 8px; }
  .foot { font-size: 12px; color: var(--dim); }

  @media (max-width: 900px) {
    .hero, .plug, .cols { grid-template-columns: minmax(0, 1fr); gap: 20px; }
    .hero .side { padding-bottom: 0; }
    .idx { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 16px; }
    .fam button { min-height: 40px; font-size: 16px; }
    .phases span:not(.cur) { visibility: hidden; }
    .arc svg { height: 72px; }
    .guide h2 { font-size: 32px; }
    #seed { font-size: 32px; }
    .acts .btn-prim { flex-basis: 100%; }
    .lanes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #viewAir .acts { order: 1; } #viewAir .idxhead, #viewAir .idx { order: 2; } #viewAir .cols { order: 3; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="hl">
      <span class="brand" data-t="brand"></span>
      <span id="pill" class="pill"><i></i><span id="pillText"></span></span>
    </div>
    <div class="hr">
      <span class="hidden" id="byWrap"><span data-t="by"></span> <span class="badge" id="fwBadge">JIANT FM</span> <span id="fwVer"></span></span>
      <div class="langs" id="langs"></div>
      <button class="themebtn" id="themeBtn"></button>
    </div>
  </header>

  <!-- ============================================================== branchement -->
  <section id="viewPlug" style="display: flex; flex-direction: column; gap: 18px">
    <div class="hero" style="grid-template-columns: minmax(0, 1fr) 320px">
      <h1 class="big" id="plugTitle" data-t="plugTitle"></h1>
      <div style="padding-bottom: 8px" data-t="plugIntro"></div>
    </div>
    <div class="plug">
      <div class="col" style="gap: 0">
        <div id="checks"></div>
        <div class="row" style="margin-top: 16px">
          <button class="btn-prim" id="connect"></button>
          <span id="conn"></span>
        </div>
      </div>
      <div class="guide">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap">
          <h2 class="big" data-t="howTitle"></h2><span style="font-size: 12px">MENU › CONTROL</span>
        </div>
        <div data-t="why"></div>
        <ol id="steps"></ol>
        <div class="note" data-t="notAll"></div>
        <div style="font-size: 13px" data-t="loopTip"></div>
        <div class="listen" id="listen"><i></i><span></span></div>
      </div>
    </div>
    <div class="idxhead"><span class="label" data-t="startStyle"></span><span class="hint" data-t="hintStart"></span></div>
    <div class="idx" id="idxPlug"></div>
    <div class="row" style="margin-top: 6px">
      <button class="btn-prim huge" id="play"></button>
      <button class="btn" id="surprisePlug" data-t="surprise"></button>
      <button class="btn hidden" id="restoreMine" data-t="restoreMine"></button>
    </div>
    <div id="plugStatus" style="font-size: 13px"></div>
  </section>

  <!-- ============================================================== à l'antenne -->
  <section id="viewAir" class="hidden" style="display: flex; flex-direction: column; gap: 14px">
    <div class="hero">
      <div id="titleBox"><div class="big" id="title">-</div></div>
      <div class="side"><div id="seed"></div><div id="meta"></div><div id="status"></div></div>
    </div>
    <div class="banner hidden" id="banner"><b id="bannerTitle"></b><span id="bannerText" style="flex: 3; min-width: 220px"></span><div class="gauge"><i id="bannerGauge"></i></div></div>
    <div class="arc">
      <svg id="arc" viewBox="0 0 1000 96" preserveAspectRatio="none" role="img">
        <path id="arcAll"></path>
        <path id="arcDone"></path>
        <line id="arcHead" x1="0" y1="0" x2="0" y2="96" stroke-width="2" vector-effect="non-scaling-stroke"></line>
      </svg>
      <div class="phases" id="phases"></div>
    </div>
    <div class="lanes" id="lanes" role="list"></div>
    <div class="idxhead"><span class="label" id="idxTitle"></span><span class="hint" data-t="hintAir"></span></div>
    <div class="idx" id="idxAir"></div>
    <div class="row acts" style="margin-top: 6px">
      <button class="btn-prim" id="next" data-t="next"></button>
      <button class="btn" id="surprise" data-t="surprise"></button>
      <button class="btn" id="fav" data-t="keep"></button>
      <button class="btn" id="hold" data-t="stay"></button>
      <button class="btn" id="stop" data-t="stop"></button>
    </div>
    <div class="cols">
      <div class="col">
        <div class="label" data-t="schedule"></div>
        <div class="sched" id="sched"></div>
      </div>
      <div class="col">
        <div class="label" data-t="keptTitle"></div>
        <ul class="favs" id="favs"></ul>
        <div id="favEmpty" style="font-size: 12px" data-t="favEmpty"></div>
      </div>
    </div>
  </section>

  <details>
    <summary data-t="settings"></summary>
    <div class="settings">
      <label><span data-t="energy"></span> <input type="range" id="energy" min="0" max="100" value="40"> <span id="energyV">40</span></label>
      <label><span data-t="duration"></span> <select id="dur"><option value="3">3 min</option><option value="5" selected>5 min</option><option value="8">8 min</option><option value="15">15 min</option></select></label>
      <label><span data-t="tracksSet"></span> <select id="six"><option value="1" selected>6 (MENU › TRACKS 6)</option><option value="0">4</option></select></label>
      <label><span data-t="clock"></span> <select id="clk"><option value="machine" selected data-t="clkMachine"></option><option value="app" data-t="clkApp"></option></select></label>
      <label><input type="checkbox" id="keepMine" checked> <span data-t="keepMine"></span></label>
    </div>
    <div class="foot" id="genInfo"></div>
  </details>
  <details>
    <summary data-t="logTitle"></summary>
    <div id="log"></div>
  </details>
  <div class="foot" data-t="credits"></div>
</main>

<script>
"use strict";
/* =========================================================================================================
 * FM-1 Radio. Protocole : éditeur SysEx de JIANT, F0 7D 46 4C <cmd> <args> F7 (web/EDITOR_PROTOCOL.md).
 * Sécurité : tout envoi passe par send() et sa liste blanche (voir allowed()).
 * Interface : DA Index (thèmes jour et signal), textes dans I18N (anglais par défaut, français ; allemand et néerlandais prévus).
 * ========================================================================================================= */
const QS = new URLSearchParams(location.search);
const SIM = QS.has("sim"), FAST = SIM && QS.has("fast");
const SPEED = FAST ? 8 : 1;
const HDR = [0x7D, 0x46, 0x4C];
const CMD = { INFO: 1, GET: 2, SET: 3, DESC: 5, PRESET: 8, NAMES: 10, WATCH: 22, PING: 25, TRACK: 27, TRACK_DUMP: 29, TRACK_STEP: 30, TRACK_PARAM: 31, SONG: 33 };
const P_LEVEL = 0, P_SLEN = 29, P_MUTE = 40;
const G_BPM = 0, G_CLOCK = 2, G_DJF = 17;
const ROLE = ["DRUM", "BASS", "PAD", "LEAD", "ARP", "TEX"];
const GLOBAL_LABELS_OK = new Set(["SWING", "TIME", "FEEDBK", "TONE", "MIX", "SIZE", "DAMP", "RATE", "DEPTH", "REL", "CLIP", "TYPE",
  "PUNCH", "DUCK", "PING", "MOD", "PRE", "FILT", "WIDE", "PITCH", "SPRAY"]);
/* les styles, rangés par famille (le classement est le nôtre, pas celui de JIANT) ; energy : l'énergie de départ */
const FAMILIES = [
  { key: "house", energy: 40, g: ["HOUSE", "DEEP HOUSE", "MICRO HOUSE", "TECH HOUSE", "ACID HOUSE", "DISCO", "ITALO", "UK GARAGE"] },
  { key: "techno", energy: 50, g: ["TECHNO", "DETROIT", "DUB TECHNO", "HARD TECHNO", "HYPNOTIC", "TRANCE", "ELECTRO", "EBM"] },
  { key: "synth", energy: 45, g: ["SYNTH POP", "DARKWAVE", "MINIMAL SYNTH", "MAN MACHINE", "MOTORIK"] },
  { key: "guitar", energy: 50, g: ["POST PUNK", "TRIBAL PUNK", "INDIE", "SHOEGAZE", "POST ROCK"] },
  { key: "groove", energy: 40, g: ["FUNK", "BOOM BAP", "TRAP", "AFROBEAT", "JAZZ", "BOSSA"] },
  { key: "bass", energy: 50, g: ["DUBSTEP", "BREAKS", "DRUM & BASS", "DUB", "STEPPERS", "BROKEN", "IDM"] },
  { key: "calm", energy: 20, g: ["AMBIENT", "NEO CLASSIC", "IMPRESSION", "SOUNDTRACK"] },
];

/* ----------------------------------------------------------------- langues */
const I18N = {
  en: {
    brand: "FM-1 RADIO", onAir: "ON AIR", offAir: "OFF AIR", waiting: "WAITING FOR PLAY", by: "broadcast by", soon: "Soon",
    plugTitle: "Plug in your FM-1", plugIntro: "The radio checks everything it can. What's left happens on the machine.",
    connect: "Connect", reconnect: "Reconnect", start: "Start the radio", restoreMine: "Put my music back",
    c1: "USB data cable, Chrome or Edge", c2: "Firmware", c3: "Machine clock", c4: "LOOP mode, no armed track", c5: "Your music",
    sWait: "waiting", sPort: "FM-1 PORT FOUND", sNoClock: "NOTHING RECEIVED", sClock: "RECEIVED", sAppClock: "app clock (USB)", sAtLaunch: "checked at launch", sArmed: "A TRACK IS ARMED",
    sCopy: "a copy is kept", sNoCopy: "save it (SAVE)",
    howTitle: "MIDI OUT to CLOCK", why: "The radio follows your machine's clock: you keep the tempo and all your settings.",
    steps: [["HOLD HOME 1 s", "opens the MENU"], ["ALGORITHM", "to the CONTROL tab"], ["SELECT", "to the MIDI OUT row"], ["any knob", "from KEYS to CLOCK"], ["HOME", "closes and saves"]],
    notAll: "Not ALL: with ALL, the machine also sends its sequencer's notes, and the radio would think you're playing.",
    loopTip: "LOOP mode: machine stopped, hold SAVE and press D5.",
    listening: "Listening for the clock... turns black by itself.", clockOk: "Clock received: you're good.", notConnected: "Connect the FM-1 first.",
    tracks: "Tracks", schedule: "Schedule", keptTitle: "Kept", startStyle: "Starting style", hintStart: "pick one, or let the radio surprise you",
    idxTitle: "All {n} styles", hintAir: "on air in color · tap one to queue it, tap again to cancel", surprise: "Surprise me",
    toNight: "Switch to the signal theme", toDay: "Switch to the day theme",
    fam: { house: "House & disco", techno: "Techno", synth: "Synth & wave", guitar: "Guitars", groove: "Groove", bass: "Bass & breaks", calm: "Calm", other: "More" },
    next: "Next tune →", keep: "Keep", stay: "Stay here", resume: "Back to the radio", stop: "Stop",
    playing: "You're playing", playingText: "The radio keeps this tune and touches nothing. It picks up again 30 s after your last move.",
    holdingTitle: "Staying here", holdingText: "The radio keeps this tune until you hand it back.",
    meta: "{fam} · {bpm} BPM · energy {e}",
    phase: { intro: "intro", build: "build", peak: "peak", breakdown: "breathe", outro: "outro" },
    arcs: { classique: "classic", vague: "wave", lent: "slow", "double sommet": "double peak" },
    intros: { nappe: "pad", "rythme filtré": "filtered beat", "basse d'abord": "bass first", "écho": "echo", percussions: "percussion" },
    lane: { off: "off", on: "on", write: "writing", wait: "queued" },
    sched: { played: "played", now: "on air", next: "next", surprise: "surprise" },
    favEmpty: "Nothing yet. A tune is a genre, an energy and a seed: it plays back identically.",
    play: "Play", copy: "Copy", remove: "Remove", fallbackTag: "fallback",
    settings: "Settings", energy: "Energy", duration: "Tune length", tracksSet: "Tracks", clock: "Clock",
    clkMachine: "the machine (you keep control)", clkApp: "the app (CLOCK USB)", keepMine: "keep a copy of my music to put it back at the end",
    logTitle: "Technical log",

      }
      const [le, lp] = choosePreset(r, 3); tracks.push({ role: 3, eng: le, preset: lp, pSet: { [P_SLEN]: 64 }, len: 64, steps: lead });
      // TEX : vide, sauf ambient

      const [te, tp] = choosePreset(r, 5); tracks.push({ role: 5, eng: te, preset: tp, pSet: { [P_SLEN]: 16 }, len: 16, steps: tex });
      const SENDS = { 0: [0, 0, 0, 12], 1: [8, 0, 0, 0], 2: [0, 22, 10, 40], 3: [6, 0, 28, 30], 4: [0, 12, 30, 22], 5: [0, 0, 20, 55] };
      for (const t of tracks) { const sd = SENDS[t.role]; t.pSet[33] = sd[0]; t.pSet[34] = sd[1]; t.pSet[35] = sd[2]; t.pSet[36] = sd[3]; }
      if (!six) { tracks[4].mute = true; tracks[5].mute = true; }
      return { version: "fallback", genre: gi, genreName: name, seed, energy, complex, human, bpm, globals: {}, tracks };
    } };
}

/* =========================================================================================================
 * Le mix. Chaque morceau suit un arc (intro, montée, sommet, respiration, descente) tiré de sa seed et de son
 * énergie. Les intros varient (pas toujours le rythme d'abord). Les effets de JIANT (envois DIST, CHORUS, DLY, REV
 * par piste, FEEDBK et SIZE globaux, DJ FILTER) portent l'émotion. Entre deux morceaux, une piste de l'ancien sert
 * de pont pendant que le nouveau commence. Tout se joue aux limites de phrase (4 mesures).
 * ========================================================================================================= */

  { name: "percussions", order: [R.DRUM, R.TEX, R.ARP], fx: { [R.DRUM]: { rev: 25 } }, djf: [-24, 0] },

  "vague": ["intro:2", "peak:3*", "breakdown:2", "peak:3*", "breakdown:1", "outro:2"],
  "lent": ["intro:3", "build:2", "peak:5*", "breakdown:2", "outro:3"],

function styleFamilies() {
  const known = GEN ? GEN.genres : FAMILIES.flatMap(f => f.g);
  const fams = FAMILIES.map(f => ({ key: f.key, energy: f.energy, g: f.g.filter(g => known.includes(g)) })).filter(f => f.g.length);
  const placed = new Set(fams.flatMap(f => f.g)), other = known.filter(g => !placed.has(g));
  if (other.length) fams.push({ key: "other", energy: 45, g: other });
  return fams;
}
const famOf = g => styleFamilies().find(f => f.g.includes(g));
function renderIndex() {
  const fams = styleFamilies(), n = fams.reduce((a, f) => a + f.g.length, 0);
  const onAir = playing && piece ? piece.genreName : null;
  const queued = playing ? (NOW.next || nextPiece || {}).genreName || null : null;
  const html = air => fams.map(f => `<div class="fam"><span>${esc(t("fam." + f.key))}</span>${f.g.map(g => {
    const on = air ? g === onAir : station.genre === g, q = air && g === queued && g !== onAir;
    return `<button data-genre="${esc(g)}" class="${on ? "on" : ""}${q ? " q" : ""}" aria-pressed="${on || q}">${esc(g)}</button>`;
  }).join("")}</div>`).join("");
  $("idxPlug").innerHTML = html(false); $("idxAir").innerHTML = html(true);
  $("idxTitle").textContent = t("idxTitle", { n });
  const explore = station.genre === "EXPLORE";
  $("surprisePlug").classList.toggle("on", explore); $("surprisePlug").setAttribute("aria-pressed", explore);
  $("play").textContent = `${t("start")} · ${explore ? t("surprise") : station.genre}`;
}
function pickStyle(g) {
  if (playing && piece && !NOW.next) {
    const queued = nextPiece && wantNext ? nextPiece.genreName : null;
    if (g === queued) { nextPiece = null; wantNext = false; status("st.unqueued"); renderIndex(); renderSched(); return; }   // second clic : on annule
  }
  if (playing && NOW.next) { status("st.busyNext", { name: pieceName(NOW.next) }); return; }   // la bascule est déjà lancée
  const f = famOf(g);
  station = { genre: g, energy: g === "EXPLORE" ? 50 : f ? f.energy : 45 };
  $("energy").value = station.energy; $("energyV").textContent = station.energy;
  store.set("fm1radio.style", g);
  if (playing) { nextPiece = makePiece(station); wantNext = true; status("st.queued", { name: pieceName(nextPiece) }); renderSched(); }
  renderIndex(); setButtons();
}
for (const id of ["idxPlug", "idxAir"]) $(id).onclick = e => { const b = e.target.closest("button[data-genre]"); if (b) pickStyle(b.dataset.genre); };
$("surprisePlug").onclick = () => pickStyle("EXPLORE");
$("surprise").onclick = () => pickStyle("EXPLORE");

/* le titre prend toute la largeur sans déborder */
function fitTitle() {
  const el = $("title"), box = $("titleBox"); if (!box.clientWidth) return;
  let size = Math.min(196, Math.max(56, box.clientWidth * 0.3));
  el.style.fontSize = size + "px";
  while (el.scrollWidth > box.clientWidth && size > 36) { size -= 6; el.style.fontSize = size + "px"; }
}
window.addEventListener("resize", fitTitle);
function renderNow() {
  if (!piece) return;
  const tt = $("title");
  if (NOW.next) tt.innerHTML = `<span class="old">${esc(piece.genreName)}</span><span class="arrow">→</span><span class="new">${esc(NOW.next.genreName)}</span>`;
  else tt.textContent = piece.genreName;
  const p = NOW.next || piece, f = famOf(p.genreName);
  $("seed").textContent = `N° ${pad4(p.seed)}`;
  $("meta").textContent = t("meta", { fam: f ? t("fam." + f.key) : p.genreName, bpm: p.bpm, e: p.energy });
  fitTitle(); renderArc(); renderSched(); renderIndex();
}
/* la silhouette de l'arc : un point par phrase */
function arcLevels(phases) {
  const lv = [4];
  for (const f of phases) for (let i = 0; i < f.n; i++) {
    const x = (i + 1) / f.n;
    lv.push(f.kind === "intro" ? 8 + 37 * x : f.kind === "build" ? 50 + 32 * x : f.kind === "peak" ? 94 + (i % 2 ? 6 : 0) - (i % 3 === 2 ? 4 : 0)
      : f.kind === "breakdown" ? 42 - 6 * x : 50 - 44 * x);
  }
  return lv;
}
function renderArc() {
  const phases = NOW.phases || [], total = phases.reduce((a, f) => a + f.n, 0);
  if (!total) { $("arcAll").setAttribute("d", ""); $("arcDone").setAttribute("d", ""); $("phases").innerHTML = ""; return; }
  const lv = arcLevels(phases), W = 1000, H = 96, x = i => (i * W / total).toFixed(1), y = v => (H - v * (H - 4) / 100).toFixed(1);
  const area = upto => `M0,${H} ` + lv.slice(0, upto + 1).map((v, i) => `L${x(i)},${y(v)}`).join(" ") + ` L${x(upto)},${H} Z`;
  $("arcAll").setAttribute("d", area(total));
  headX = -1; drawHead();
  $("arc").setAttribute("aria-label", NOW.arc ? `${t("arcs." + NOW.arc) || NOW.arc}` : "");
  $("phases").innerHTML = phases.map((f, i) => `<span style="flex: ${f.n} 1 0" class="${i === NOW.ph ? "cur" : ""}">${esc(t("phase." + f.kind))}</span>`).join("");
}
/* la partie jouée de l'arc et la tête de lecture, à chaque image : la phrase en cours avance avec l'horloge.
   NOW.done compte les phrases commencées ; dans une phrase, la part jouée vient des impulsions depuis son début. */
function arcProgress() {
  const total = (NOW.phases || []).reduce((a, f) => a + f.n, 0);
  if (!total || !NOW.done) return 0;
  return Math.min(total, NOW.done - 1 + Math.min(1, Math.max(0, (playedPulse() - NOW.at) / PHRASE)));
}
let headX = -1;
function drawHead() {
  const phases = NOW.phases || [], total = phases.reduce((a, f) => a + f.n, 0); if (!total) return;
  const prog = arcProgress(), x = prog * 1000 / total;
  if (Math.abs(x - headX) < 0.05) return;
  headX = x;
  const lv = arcLevels(phases), H = 96, y = v => (H - v * (H - 4) / 100).toFixed(1), i0 = Math.floor(prog);
  const vAt = i0 < lv.length - 1 ? lv[i0] + (lv[i0 + 1] - lv[i0]) * (prog - i0) : lv[lv.length - 1];
  const pts = lv.slice(0, i0 + 1).map((v, i) => `L${(i * 1000 / total).toFixed(1)},${y(v)}`).join(" ");
  $("arcDone").setAttribute("d", `M0,${H} ${pts} L${x.toFixed(1)},${y(vAt)} L${x.toFixed(1)},${H} Z`);
  $("arcHead").setAttribute("x1", x.toFixed(1)); $("arcHead").setAttribute("x2", x.toFixed(1));
}
(function frame() { if (playing && !document.hidden) drawHead(); requestAnimationFrame(frame); })();
/* les pistes : allumée, coupée, en cours d'écriture (avec sa progression) */
function renderLanes() {
  const n = dev ? dev.nTrk : 6;
  $("lanes").innerHTML = Array.from({ length: n }, (_, k) => {
    const ln = lane[k], st = ln.state === "write" ? (ln.pct ? `${ln.pct} %` : t("lane.wait")) : t("lane." + ln.state);
    return `<div class="lane ${ln.state}" role="listitem" title="${esc(ln.state === "write" ? t("lane.write") + " " + ln.pct + " %" : t("lane." + ln.state))}">
      <i style="width:${ln.state === "write" ? ln.pct : 0}%"></i><b>${ln.role !== null ? ROLE[ln.role] : "T" + (k + 1)}</b><span>${esc(st)}</span></div>`;
  }).join("");
}
const hhmm = d => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
function renderSched() {
  const rows = history.slice(-3).map((h, i, a) => [hhmm(h.at), h.name, i === a.length - 1 ? "now" : "played"]);
  const nx = NOW.next || nextPiece;
  rows.push(["", nx ? pieceName(nx) : "...", nx ? "next" : "surprise"]);
  $("sched").innerHTML = rows.map(([tm, name, k]) => `<div class="${k}"><span>${tm} ${esc(name)}</span><span>${esc(t("sched." + k))}</span></div>`).join("");
}
function renderBanner() {
  const busy = playing && userBusy(), show = playing && (busy || holding);
  $("banner").classList.toggle("hidden", !show);
  if (!show) return;
  $("bannerTitle").textContent = busy ? t("playing") : t("holdingTitle");
  $("bannerText").textContent = busy ? t("playingText") : t("holdingText");
  const left = busy ? 1 - (performance.now() - lastActive) / (30000 / (FAST ? 30 : 1)) : 1;
  $("bannerGauge").style.width = Math.max(0, Math.min(100, left * 100)) + "%";
}
function setButtons() {
  const clockOk = $("clk").value === "app" || performance.now() - CLK.lastPulse < 1200;
  $("play").disabled = !ready || connecting || starting || !station || playing || CHK.fw !== "ok" || !clockOk;
  for (const id of ["stop", "next", "fav", "hold", "surprise"]) $(id).disabled = !playing;
  $("hold").textContent = holding ? t("resume") : t("stay");
  $("hold").classList.toggle("on", holding);
  $("restoreMine").classList.toggle("hidden", !saved || playing);
  $("restoreMine").disabled = playing || !saved;
  renderFavs();
}
function renderAll() { renderStatic(); renderHeader(); renderChecks(); renderIndex(); renderLanes(); renderNow(); renderSched(); renderStatus(); renderGenInfo(); setButtons(); }
$("energy").oninput = () => { $("energyV").textContent = $("energy").value; };
$("clk").onchange = () => { renderChecks(); setButtons(); };
$("keepMine").onchange = renderChecks;
$("connect").onclick = connect;
$("play").onclick = async () => { if (playing || starting || !ready) return; starting = true; setButtons(); try { await start(); } finally { starting = false; setButtons(); } };
$("stop").onclick = stop;
$("next").onclick = () => { if (playing) { nextPiece = makePiece(station); holding = false; lastActive = -1e9; wantNext = true; setButtons(); status("st.arrives", { name: pieceName(nextPiece) }); renderSched(); renderIndex(); } };
$("restoreMine").onclick = restoreMine;
$("hold").onclick = () => { holding = !holding; setButtons(); status(holding ? "st.holding" : "st.playing"); };
window.addEventListener("beforeunload", e => { if (playing) { e.preventDefault(); e.returnValue = ""; } });
setInterval(() => { renderBanner(); if (!playing) { renderChecks(); setButtons(); } }, 400);
(async () => {
  const g = store.get("fm1radio.style", null);
  if (typeof g === "string" && (g === "EXPLORE" || FAMILIES.some(f => f.g.includes(g)))) { const f = famOf(g); station = { genre: g, energy: g === "EXPLORE" ? 50 : f ? f.energy : 45 }; }
  $("energy").value = station.energy; $("energyV").textContent = station.energy;
  renderAll();
  await loadGen();
  renderIndex();
})();

/* =========================================================================================================
 * Simulateur (?sim=1, ?sim=1&fast=1) : un faux FM-1 JIANT V10.26. Les trames reçues sont dans window.__simSent.
 * ========================================================================================================= */
function simAccess() {
  const ENG = ["ANALOG", "-", "PHASE", "LOFI", "-", "VOICE", "-", "WHEEL", "STRING", "-", "DRUM", "NOISE", "FM6", "ADD", "ANIMAL"];
  const PC = 123, GC = 72, NT = 6, NS = 64;
  const GL = ["BPM", "SWING", "CLOCK", "TUNE", "TIME", "FEEDBK", "TONE", "MIX", "SIZE", "DAMP", "RATE", "DEPTH", "MIDI", "REL", "ROUTE", "INFO", "SLOT", "DJ FILT", "LOAD", "SAVE", "ENG", "CLIP", "CLRSEQ", "INIT", "TYPE", "PUNCH", "DUCK"];
  const label = (sc, id) => sc ? (GL[id] || (id < 40 ? "MOD" : "X" + id)) : ({ 0: "LEVEL", 29: "LEN", 40: "MUTE", 33: "DIST", 34: "CHORUS", 35: "DLY", 36: "REV" }[id] || "P" + id);
  const g = new Array(GC).fill(0); g[0] = 125;
  const st = () => [1, 48, 0, 0, 0, 0, 0, 100, 0, 0, 0, 100, 1];
  const trk = Array.from({ length: NT }, (_, i) => ({ eng: [10, 12, 0, 0, 7, 11][i], preset: 0, p: Array.from({ length: PC }, (_, j) => j === 0 ? 100 : j === 29 ? 32 : 0), step: Array.from({ length: NS }, st) }));
  let sel = 0, songRunning = false, watch = 0, playingM = false; const LAT = FAST ? 3 : 90;
  window.__simSent = []; window.__sim = { g, trk };
  const rt = b => input.onmidimessage && input.onmidimessage({ data: Uint8Array.from([b]) });
  setTimeout(function pulse() { if (g[2] === 0) rt(0xF8); setTimeout(pulse, 60000 / (Math.max(40, g[0]) * 24 * SPEED)); }, 0);   // MIDI OUT CLOCK : aussi à l'arrêt
  window.__simPlay = () => { playingM = true; rt(0xFA); };
  window.__simStop = () => { playingM = false; rt(0xFC); };
  window.__simTouch = () => { if (watch) reply(32, [2, 33, ...v14(70)]); };
  window.__simKey = () => input.onmidimessage && input.onmidimessage({ data: Uint8Array.from([0x90, 60, 100]) });
  const input = { name: "FM-1 (sim)", onmidimessage: null };
  const reply = (cmd, args, slow) => setTimeout(() => input.onmidimessage && input.onmidimessage({ data: Uint8Array.from([0xF0, ...HDR, cmd, ...args, 0xF7]) }), slow ? LAT : 2);
  const str = s => [...s].map(c => c.charCodeAt(0)).concat(0);
  const output = { name: "FM-1 (sim)", send(data) {
    const d = Array.from(data); window.__simSent.push(d);
    if (d[0] !== 0xF0) return;
    const cmd = d[4], a = d.slice(5, -1);
    switch (cmd) {
      case 1: reply(1, [...str("JIANT V10.26"), ENG.length, PC, GC, NS, 115, ...ENG.flatMap(str), NT, 16, 0x55, 1, 0, 0x4D, 1, 64, 1, 0x4A, 1, 1]); break;
      case 2: reply(2, [a[0], a[1], ...v14(a[0] ? g[a[1]] : trk[sel].p[a[1]])]); break;
      case 3: g[a[1]] = rv14(a, 2); reply(3, [a[0], a[1], ...v14(g[a[1]])], true); break;
      case 5: reply(5, [a[0], a[1], 0, ...v14(0), ...v14(127), ...v14(0), ...str(label(a[0], a[1])), ...str("")]); break;
      case 8: trk[sel].eng = a[0]; trk[sel].preset = a[1]; reply(8, [a[0], a[1]]); break;
      case 10: reply(10, [a[0], 6, ...["INIT", "SUB BASS", "WARM PAD", "SAW LEAD", "PLUCK", "WIND"].flatMap(str), ...str("E1"), ...str("E2")]); break;
      case 27: if (a.length) sel = a[0]; reply(27, [sel, NT, ...trk.flatMap(t => [t.eng, t.preset, ...v14(t.p[0]), t.p[40], 0])]); break;
      case 29: reply(29, [a[0], trk[a[0]].eng, trk[a[0]].preset, ...trk[a[0]].p.flatMap(v14)]); break;
      case 30: { const t = trk[a[0]]; if (a.length === 15) t.step[a[1]] = a.slice(2); reply(30, [a[0], a[1], ...t.step[a[1]]], a.length === 15); break; }
      case 31: { const t = trk[a[0]]; if (a.length === 4) t.p[a[1]] = rv14(a, 2); reply(31, [a[0], a[1], ...v14(t.p[a[1]])], a.length === 4); break; }
      case 33: reply(33, [0, 0, 0, songRunning ? 1 : 0, 0, 0]); break;
      case 22: watch = a[0]; reply(22, [a[0]]); break;
    }
  } };
  return { sysexEnabled: true, inputs: new Map([["i", input]]), outputs: new Map([["o", output]]) };
}
